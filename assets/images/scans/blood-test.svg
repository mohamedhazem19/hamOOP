<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Blood test results, CBC and lipids" font-family="Arial, sans-serif">
  <rect width="400" height="300" fill="#e8f3ee"/>
  <rect x="12" y="12" width="376" height="276" rx="12" fill="#ffffff" stroke="#e3ebe7"/>
  <rect x="12" y="12" width="376" height="48" rx="12" fill="#0b4d3b"/><rect x="12" y="44" width="376" height="16" fill="#0b4d3b"/>
  <text x="28" y="43" font-size="17" font-weight="700" fill="#ffffff">Blood test – CBC &amp; lipids</text>
  <text x="34" y="84" font-size="11" font-weight="700" fill="#4b5f57">TEST</text>
  <text x="200" y="84" font-size="11" font-weight="700" fill="#4b5f57">RESULT</text>
  <text x="300" y="84" font-size="11" font-weight="700" fill="#4b5f57">NORMAL</text>
  <rect x="24" y="100" width="352" height="26" fill="#ffffff"/><text x="34" y="118" font-size="13" fill="#10231c">Haemoglobin</text><text x="200" y="118" font-size="13" font-weight="700" fill="#10231c">14.2 g/dL</text><text x="300" y="118" font-size="12" fill="#4b5f57">13.5–17.5</text><rect x="24" y="128" width="352" height="26" fill="#f7faf8"/><text x="34" y="146" font-size="13" fill="#10231c">White cells</text><text x="200" y="146" font-size="13" font-weight="700" fill="#10231c">6.8 ×10⁹/L</text><text x="300" y="146" font-size="12" fill="#4b5f57">4.0–11.0</text><rect x="24" y="156" width="352" height="26" fill="#ffffff"/><text x="34" y="174" font-size="13" fill="#10231c">Platelets</text><text x="200" y="174" font-size="13" font-weight="700" fill="#10231c">250 ×10⁹/L</text><text x="300" y="174" font-size="12" fill="#4b5f57">150–400</text><rect x="24" y="184" width="352" height="26" fill="#fdecea"/><text x="34" y="202" font-size="13" fill="#10231c">Total cholesterol</text><text x="200" y="202" font-size="13" font-weight="700" fill="#b91c1c">212 mg/dL ▲</text><text x="300" y="202" font-size="12" fill="#4b5f57">&lt; 200</text><rect x="24" y="212" width="352" height="26" fill="#ffffff"/><text x="34" y="230" font-size="13" fill="#10231c">LDL</text><text x="200" y="230" font-size="13" font-weight="700" fill="#10231c">128 mg/dL</text><text x="300" y="230" font-size="12" fill="#4b5f57">&lt; 130</text><rect x="24" y="240" width="352" height="26" fill="#f7faf8"/><text x="34" y="258" font-size="13" fill="#10231c">HDL</text><text x="200" y="258" font-size="13" font-weight="700" fill="#10231c">52 mg/dL</text><text x="300" y="258" font-size="12" fill="#4b5f57">&gt; 40</text>
  <text x="24" y="280" font-size="11" fill="#4b5f57">Sample image · HAM Hospital lab</text>
</svg>
